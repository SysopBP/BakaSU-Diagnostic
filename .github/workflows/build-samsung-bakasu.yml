name: Build KitsuSU for Samsung (FragX-compatible)
on:
  push:
    branches: [main, 'feat/samsung-jailbreak', 'feat/kitsusu-recovery-controls', 'fix/tablet-soft-reboot-service-parser', 'diagnostics/susfs-gate-hooks-20261023', 'diagnostics/susfs-eligibility-reasons-20261023', 'test/bakasu-upstream-sync-20261023', 'fix/samsung-bootchecker-soft-reboot-20261024']
    paths:
      - 'scripts/apply-susfs-gate-diagnostics.py'
      - 'scripts/apply-samsung-jailbreak.py'
      - 'scripts/apply-samsung-manager.py'
      - 'scripts/verify-manager-artwork.py'
      - 'scripts/*soft-reboot-parser.py'
      - 'tests/service-list-parser.rs'
      - 'vendor/**'
      - 'patches/bakasu/**'
      - 'scripts/apply-upstream-series.py'
      - 'scripts/verify-samsung-integration.py'
      - '.github/workflows/build-samsung-bakasu.yml'
  pull_request:
    branches: [main, 'feat/samsung-jailbreak']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  BAKASU_REF: 39faf94a2d4a40d48093398bafcde649916edbc1
  SUSFS_REF: 8ab4500ffc3f13ec6ded79d7ab13e2e8147a1879
  KSU_PACKAGE_NAME: app.kitsusu.manager
  KEYSTORE_ALIAS: fragx
  KEYSTORE_PASS: android
jobs:
  bootchecker-check:
    name: Samsung bootchecker regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test preflight without Android or device access
        run: |
          rustc --edition=2024 --test vendor/userspace/samsung_bootchecker.rs -o /tmp/bootchecker-tests
          /tmp/bootchecker-tests
  prep:
    name: Signing key and manager signature
    runs-on: ubuntu-24.04
    outputs:
      cert_size: ${{ steps.cert.outputs.size }}
      cert_hash: ${{ steps.cert.outputs.hash }}
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate per-run test key
        id: cert
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore keystore.jks -alias "$KEYSTORE_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname 'CN=FragX BakaSU Test'
          keytool -exportcert -keystore keystore.jks -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_PASS" -file cert.der
          echo "size=0x$(printf '%x' "$(stat -c%s cert.der)")" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum cert.der | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: signing
          retention-days: 1
          path: |
            keystore.jks
            cert.der
  lkm:
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kmi: [android12-5.10, android13-5.10, android13-5.15, android14-5.15, android14-6.1, android15-6.6, android16-6.12, android17-6.18]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          path: fork
      - name: Checkout pinned BakaSU and apply Samsung port
        run: |
          set -euo pipefail
          git clone https://github.com/Baka-SU/BakaSU.git upstream
          git -C upstream checkout --detach "$BAKASU_REF"
          python3 fork/scripts/apply-upstream-series.py --source upstream
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream"
          cp fork/vendor/kernel/compat/* upstream/kernel/compat/
          cd upstream
          python3 ../fork/scripts/apply-samsung-jailbreak.py
          python3 ../fork/scripts/apply-samsung-manager.py
      - name: Build and validate driver
        working-directory: upstream/kernel
        run: |
          set -euo pipefail
          CONFIG_KSU=m CONFIG_KSU_MULTI_MANAGER_SUPPORT=y CONFIG_KSU_TRACEPOINT_HOOK=y \
            KSU_EXPECTED_SIZE="${{ needs.prep.outputs.cert_size }}" \
            KSU_EXPECTED_HASH="${{ needs.prep.outputs.cert_hash }}" CC=clang make -j"$(nproc)"
          test -s kernelsu.ko
          llvm-nm kernelsu.ko > symbols.txt
          grep ksu_rkp_branch_patch symbols.txt
          strings kernelsu.ko > strings.txt
          grep -F '@KitsuSU' strings.txt
          if grep -Fq '@ReSukiSU' strings.txt; then
            echo 'Driver still reports old ReSukiSU branding' >&2
            exit 1
          fi
          for feature in RKP KDP DEFEX; do grep "Samsung $feature detected" strings.txt; done
          llvm-strip -d kernelsu.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp kernelsu.ko "$GITHUB_WORKSPACE/out/${{ matrix.kmi }}_kernelsu.ko"
      - uses: actions/upload-artifact@v6
        with:
          name: lkm-${{ matrix.kmi }}
          path: ${{ github.workspace }}/out/*_kernelsu.ko
          if-no-files-found: error
  ksud:
    needs: [prep, lkm, bootchecker-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: fork
      - name: Checkout pinned BakaSU and apply Samsung port
        run: |
          set -euo pipefail
          git clone https://github.com/Baka-SU/BakaSU.git upstream
          git -C upstream checkout --detach "$BAKASU_REF"
          python3 fork/scripts/apply-upstream-series.py --source upstream
          cp fork/vendor/kernel/compat/* upstream/kernel/compat/
          cd upstream
          python3 ../fork/scripts/apply-samsung-jailbreak.py
          python3 ../fork/scripts/apply-samsung-manager.py
          python3 ../fork/scripts/apply-soft-reboot-parser.py
          python3 ../fork/scripts/verify-samsung-integration.py --source .
      - uses: actions/download-artifact@v7
        with:
          pattern: lkm-*
          merge-multiple: true
          path: drivers
      - name: Stage patched drivers only
        run: |
          set -euo pipefail
          rm -f upstream/userspace/ksud/bin/aarch64/*_kernelsu.ko
          cp drivers/*_kernelsu.ko upstream/userspace/ksud/bin/aarch64/
          test "$(find upstream/userspace/ksud/bin/aarch64 -name '*_kernelsu.ko' | wc -l)" -eq 8
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src
      - name: Test Samsung bootchecker preflight
        run: |
          rustc --edition=2024 --test upstream/userspace/ksud/src/android/soft_reboot/samsung_bootchecker.rs -o /tmp/bootchecker-tests
          /tmp/bootchecker-tests
      - name: Test service-list parser with host Rust harness
        run: python3 fork/scripts/test-soft-reboot-parser.py --source upstream
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build bootstrap and ksud
        working-directory: upstream
        run: |
          set -euo pipefail
          clang --target=aarch64-linux-gnu -c -nostdlib -o userspace/ksud/.lkm_image_bootstrap.o userspace/ksud/src/lkm_image_bootstrap.S
          cd userspace/ksud
          readelf -h bin/aarch64/waitsys | grep -q AArch64
          test -s bin/aarch64/waitsys
          cargo ndk b -P 26 -t aarch64-linux-android -r -Z build-std-features="optimize_for_size" -Z trim-paths
          test -s target/aarch64-linux-android/release/ksud
      - name: Bundle corresponding modified source and licenses
        run: |
          set -euo pipefail
          python3 fork/scripts/verify-manager-artwork.py --source upstream
          mkdir -p source-bundle
          cp -a fork/vendor fork/scripts fork/patches fork/.github source-bundle/
          sha256sum fork/patches/bakasu/*.patch > source-bundle/UPSTREAM_PATCH_SHA256SUMS.txt
          git -C upstream rev-parse HEAD > source-bundle/BAKASU_COMMIT.txt
          git -C upstream log --reverse --format='%H %s' 239e1e8871b8fcd51a6e5b3002e0ba522fdd99fb..HEAD > source-bundle/UPSTREAM_COMMITS.txt
          cp -a fork/docs source-bundle/
          tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle -czf KitsuSU-samsung-source.tar.gz upstream source-bundle
          python3 fork/scripts/verify-manager-artwork.py --archive KitsuSU-samsung-source.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: KitsuSU-samsung-source
          path: KitsuSU-samsung-source.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: ksud
          path: upstream/userspace/ksud/target/aarch64-linux-android/release/ksud
          if-no-files-found: error
  manager-check:
    name: Manager formatting, lint and compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: fork
      - name: Checkout and adapt reviewed manager
        run: |
          git clone https://github.com/Baka-SU/BakaSU.git upstream
          git -C upstream checkout --detach "$BAKASU_REF"
          python3 fork/scripts/apply-upstream-series.py --source upstream
          cd upstream
          python3 ../fork/scripts/apply-samsung-manager.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build manager APK
        working-directory: upstream/manager
        run: |
          chmod +x gradlew
          # Restore the manager build mode used by the phone-tested working APK.
          ./gradlew spotlessApply --no-daemon --no-configuration-cache
          ./gradlew spotlessCheck :app:lintDebug :app:assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon
      - name: Print lint diagnostics on failure
        if: failure()
        run: |
          find upstream/manager/app/build -name 'lint-results-*.txt' -exec cat {} +
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: manager-validation-reports
          path: upstream/manager/app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: manager-unsigned-debug
          path: upstream/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  apk:
    needs: [prep, ksud, manager-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: fork
      - name: Checkout pinned BakaSU
        run: |
          git clone https://github.com/Baka-SU/BakaSU.git upstream
          git -C upstream checkout --detach "$BAKASU_REF"
          python3 fork/scripts/apply-upstream-series.py --source upstream
          cd upstream
          python3 ../fork/scripts/apply-samsung-manager.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v7
        with:
          name: signing
      - uses: actions/download-artifact@v7
        with:
          name: ksud
          path: ksud-bin
      - uses: actions/download-artifact@v7
        with:
          name: manager-unsigned-debug
          path: upstream/manager/app/build/outputs/apk/debug
      - name: Stage daemon and repack
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p target/aarch64-linux-android/release
          cp "$GITHUB_WORKSPACE/ksud-bin/ksud" target/aarch64-linux-android/release/ksud
          python3 repack_apk_multi.py repack -b debug -t release -a arm64-v8a -K "$GITHUB_WORKSPACE/keystore.jks" -A "$KEYSTORE_ALIAS" -P "$KEYSTORE_PASS" -S "$KEYSTORE_PASS"
      - name: Validate APK signature and embedded daemon
        run: |
          set -euo pipefail
          APK=$(find upstream/dist -type f -name '*.apk' -print -quit)
          test -s "$APK"
          python3 fork/scripts/verify-manager-artwork.py --source upstream --archive "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          grep -x "application-label:'KitsuSU'" /tmp/badging.txt
          grep -q "^package: name='app.kitsusu.manager' " /tmp/badging.txt
          grep -q 'application-debuggable' /tmp/badging.txt
          unzip -Z1 "$APK" > /tmp/apk-files.txt
          grep -x 'lib/arm64-v8a/libksud.so' /tmp/apk-files.txt
          unzip -p "$APK" lib/arm64-v8a/libksud.so > /tmp/libksud.so
          cmp ksud-bin/ksud /tmp/libksud.so
          strings /tmp/libksud.so > /tmp/daemon-strings.txt
          grep -Fq 'app.kitsusu.manager' /tmp/daemon-strings.txt
          SIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/signature.txt
          grep -i "${{ needs.prep.outputs.cert_hash }}" /tmp/signature.txt
          cp "$APK" KitsuSU-samsung-arm64.apk
          sha256sum KitsuSU-samsung-arm64.apk > KitsuSU-samsung-arm64.apk.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: KitsuSU-samsung-arm64
          path: |
            KitsuSU-samsung-arm64.apk
            KitsuSU-samsung-arm64.apk.sha256
          if-no-files-found: error
  susfs-lkm:
    if: github.ref != 'refs/heads/test/bakasu-upstream-sync-20261023' && github.ref != 'refs/heads/fix/samsung-bootchecker-soft-reboot-20261024'
    name: susfs_guard_lkm (${{ matrix.kmi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - kmi: android12-5.10
          image: ghcr.io/ylarod/ddk-min:android12-5.10-20260828@sha256:272ada1e61c525116032246df2a790d1ccec1804b7a9e0b09203c5e650dcb78e
        - kmi: android13-5.10
          image: ghcr.io/ylarod/ddk-min:android13-5.10-20260828@sha256:e5ce038ba38408ad26aae1f2622cfb44dfbf6634b025bf197aa08beac0794f5b
        - kmi: android13-5.15
          image: ghcr.io/ylarod/ddk-min:android13-5.15-20260828@sha256:9e68cd9fcab748584755d31ba88ef134efc938dbde17f258c2652315f6cd81cd
        - kmi: android14-5.15
          image: ghcr.io/ylarod/ddk-min:android14-5.15-20260828@sha256:bbf697a8fe995704268eef710921c9d2ea4f146954690d7ea97887f3a4014a6a
        - kmi: android14-6.1
          image: ghcr.io/ylarod/ddk-min:android14-6.1-20260828@sha256:1dd6ac340b627a90a4031d6d0df6b129d8cc949b139fb56032c898f023d3d5d3
        - kmi: android15-6.6
          image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828@sha256:51159bc935c75a282fc65bc87e02f16bd098d1cdf55dc558c4fdd0fcf7a132e2
        - kmi: android16-6.12
          image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828@sha256:fd3ec5cc71d7f2716212e9df8d5674a9afe68fb769282fcac87b83f207f949ee
        - kmi: android17-6.18
          image: ghcr.io/ylarod/ddk-min:android17-6.18-20260828@sha256:fb8b66200bf402cf65a751060fc1aa29524b9fa8840feef16c7b196a4f3f0e6e
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
    - name: Checkout pinned susfs4ksu-lkm
      uses: actions/checkout@v5
      with:
        repository: inforcqb/susfs4ksu-lkm
        ref: ${{ env.SUSFS_REF }}
        path: susfs
    - name: Checkout diagnostic patch from this branch
      uses: actions/checkout@v5
      with:
        path: diagnostic-src
    - name: Apply additive gate diagnostics to pinned SusFS
      run: |
        set -euo pipefail
        python3 ../diagnostic-src/scripts/apply-susfs-gate-diagnostics.py
      working-directory: susfs
    - name: Build susfs_guard_lkm.ko
      working-directory: susfs
      run: |
        set -euo pipefail
        if [ -z "${KDIR:-}" ] || [ ! -f "$KDIR/Makefile" ]; then
          echo "::error::KDIR ('${KDIR:-unset}') is not a prepared kernel build tree for ${{ matrix.kmi }}"
          exit 1
        fi
        make -k -C "$KDIR" M="$PWD/kernel" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules -j"$(nproc)"
        test -s kernel/susfs_guard_lkm.ko
        mkdir -p "$GITHUB_WORKSPACE/out"
        cp kernel/susfs_guard_lkm.ko "$GITHUB_WORKSPACE/out/susfs_guard_lkm-${{ matrix.kmi }}.ko"
    - name: Assert load-critical artifact properties
      working-directory: susfs
      run: |
        set -euo pipefail
        f=kernel/susfs_guard_lkm.ko
        test -s "$f"
        command -v nm >/dev/null 2>&1 || { echo "::error::nm is missing from this image"; exit 1; }
        modinfo "$f" | grep -E 'vermagic|srcversion' || true
        readelf -p .modinfo "$f" > modinfo.txt
        test -s modinfo.txt || { echo "::error::readelf produced nothing for $f"; exit 1; }
        if ! grep -q 'import_ns' modinfo.txt; then
          echo "::error::no import_ns - kern_path/ihold/override_creds/revert_creds will be refused with -EINVAL"
          exit 1
        fi
        nm -u "$f" > undefined-symbols.txt
        test -s undefined-symbols.txt || { echo "::error::nm reported no undefined symbols - it did not read $f"; exit 1; }
        echo "undefined symbols: $(wc -l < undefined-symbols.txt)"
        if grep -qE '(^| )(kallsyms_lookup_name|kallsyms_lookup|kallsyms_lookup_size_offset|kallsyms_on_each_symbol|kallsyms_on_each_match_symbol)$' undefined-symbols.txt; then
          echo "::error::$f links kallsyms_* instead of bootstrapping them at runtime"
          grep -E '(^| )(kallsyms_lookup_name|kallsyms_lookup|kallsyms_lookup_size_offset|kallsyms_on_each_symbol|kallsyms_on_each_match_symbol)$' undefined-symbols.txt
          exit 1
        fi
        if grep -qw '__stack_chk_guard' undefined-symbols.txt; then
          echo "::error::$f references __stack_chk_guard"
          exit 1
        fi
    - name: CFI call-site gate
      working-directory: susfs
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::no python3 in this image - the CFI gate cannot run, and a skipped gate is not a pass"
          exit 1
        fi
        test -s tools/cfi_sites.py
        python3 tools/cfi_sites.py --allow "init_module,susfs_layers_down,susfs_tw_func,susfs_watch_freeing" kernel/susfs_guard_lkm.ko
    - uses: actions/upload-artifact@v6
      with:
        name: susfs-lkm-${{ matrix.kmi }}
        path: ${{ github.workspace }}/out/*.ko
        if-no-files-found: error
  susfs-tools:
    if: github.ref != 'refs/heads/test/bakasu-upstream-sync-20261023' && github.ref != 'refs/heads/fix/samsung-bootchecker-soft-reboot-20261024'
    name: susfs loader
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/ylarod/ddk-min:android14-6.1-20260828@sha256:1dd6ac340b627a90a4031d6d0df6b129d8cc949b139fb56032c898f023d3d5d3
      options: --privileged
    steps:
    - name: Checkout pinned susfs4ksu-lkm
      uses: actions/checkout@v5
      with:
        repository: inforcqb/susfs4ksu-lkm
        ref: ${{ env.SUSFS_REF }}
        path: susfs
    - name: Build susfs_insmod
      working-directory: susfs
      run: |
        set -euo pipefail
        clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
              -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
              -o /tmp/susfs_insmod tools/susfs_insmod.c
        file /tmp/susfs_insmod
        test -s /tmp/susfs_insmod
    - uses: actions/upload-artifact@v6
      with:
        name: susfs_insmod
        path: /tmp/susfs_insmod
        if-no-files-found: error
  susfs-module:
    if: github.ref != 'refs/heads/test/bakasu-upstream-sync-20261023' && github.ref != 'refs/heads/fix/samsung-bootchecker-soft-reboot-20261024'
    name: susfs flashable module
    needs:
    - susfs-lkm
    - susfs-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout pinned susfs4ksu-lkm
      uses: actions/checkout@v5
      with:
        repository: inforcqb/susfs4ksu-lkm
        ref: ${{ env.SUSFS_REF }}
        path: susfs
    - uses: actions/download-artifact@v7
      with:
        pattern: susfs-lkm-*
        path: ko
    - uses: actions/download-artifact@v7
      with:
        name: susfs_insmod
        path: bin
    - name: Name the modules after their KMI and check every one
      run: |
        set -euo pipefail
        cd ko
        for d in */; do
          kmi="${d%/}"; kmi="${kmi#susfs-lkm-}"
          mv "$d/susfs_guard_lkm-$kmi.ko" "susfs_guard_lkm-$kmi.ko"
          rmdir "$d"
        done
        for kmi in android12-5.10 android13-5.10 android13-5.15 android14-5.15 \
                   android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
          if [ ! -s "susfs_guard_lkm-$kmi.ko" ]; then
            echo "::error::expected susfs_guard_lkm-$kmi.ko is missing or empty"
            ls -l
            exit 1
          fi
        done
        n=$(ls -1 *.ko | wc -l)
        if [ "$n" -ne 8 ]; then
          echo "::error::expected exactly 8 .ko files, found $n"
          ls -l
          exit 1
        fi
        echo "all 8 expected KMI modules present"
        ls -l
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Write the pinned image list
      run: |
        cat > ddk-images.json <<'JSON'
        [
          "ghcr.io/ylarod/ddk-min:android12-5.10-20260828@sha256:272ada1e61c525116032246df2a790d1ccec1804b7a9e0b09203c5e650dcb78e",
          "ghcr.io/ylarod/ddk-min:android13-5.10-20260828@sha256:e5ce038ba38408ad26aae1f2622cfb44dfbf6634b025bf197aa08beac0794f5b",
          "ghcr.io/ylarod/ddk-min:android13-5.15-20260828@sha256:9e68cd9fcab748584755d31ba88ef134efc938dbde17f258c2652315f6cd81cd",
          "ghcr.io/ylarod/ddk-min:android14-5.15-20260828@sha256:bbf697a8fe995704268eef710921c9d2ea4f146954690d7ea97887f3a4014a6a",
          "ghcr.io/ylarod/ddk-min:android14-6.1-20260828@sha256:1dd6ac340b627a90a4031d6d0df6b129d8cc949b139fb56032c898f023d3d5d3",
          "ghcr.io/ylarod/ddk-min:android15-6.6-20260828@sha256:51159bc935c75a282fc65bc87e02f16bd098d1cdf55dc558c4fdd0fcf7a132e2",
          "ghcr.io/ylarod/ddk-min:android16-6.12-20260828@sha256:fd3ec5cc71d7f2716212e9df8d5674a9afe68fb769282fcac87b83f207f949ee",
          "ghcr.io/ylarod/ddk-min:android17-6.18-20260828@sha256:fb8b66200bf402cf65a751060fc1aa29524b9fa8840feef16c7b196a4f3f0e6e"
        ]
        JSON
    - name: Pack the module
      working-directory: susfs
      run: |
        set -euo pipefail
        tag="$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')-$(printf '%s' "$SUSFS_REF" | cut -c1-7)"
        mkdir -p dist
        python3 tools/pack_module.py --ko-dir ../ko --insmod ../bin/susfs_insmod \
          --tag "$tag" --sha "$SUSFS_REF" --run-id "$GITHUB_RUN_ID" \
          --ddk-images ../ddk-images.json \
          --out "dist/susfs_guard_lkm-module-$tag-arm64.zip"
        test -s "dist/susfs_guard_lkm-module-$tag-arm64.zip"
        ls -l dist
    - name: Rewrite provenance.json INSIDE the zip - source vs build
      working-directory: susfs
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import glob, json, os, zipfile
        zips = sorted(glob.glob("dist/*.zip"))
        if len(zips) != 1:
            raise SystemExit(f"expected exactly one zip in dist/, found {len(zips)}")
        zpath = zips[0]
        env = os.environ
        target = None
        with zipfile.ZipFile(zpath) as zin:
            for n in zin.namelist():
                if n.rsplit("/", 1)[-1] == "provenance.json":
                    target = n
                    break
            original = json.loads(zin.read(target)) if target else {}
            entries = [(i, zin.read(i.filename)) for i in zin.infolist()]
        patched = {
            "schema": "kitsusu-susfs-module-provenance/1",
            "note": ("source.* identifies the SUSFS source this module was built from. "
                     "build.* identifies the workflow that produced this zip. "
                     "packer_original is the packer's own record verbatim: its github_sha "
                     "is the source commit, and the workflow path it carries is upstream's, "
                     "not ours."),
            "source": {
                "repository": "inforcqb/susfs4ksu-lkm",
                "commit": env["SUSFS_REF"],
            },
            "build": {
                "repository": env["GITHUB_REPOSITORY"],
                "commit": env["GITHUB_SHA"],
                "ref": env["GITHUB_REF"],
                "workflow": env["GITHUB_WORKFLOW"],
                "workflow_ref": env["GITHUB_WORKFLOW_REF"],
                "run_id": env["GITHUB_RUN_ID"],
                "run_url": f'{env["GITHUB_SERVER_URL"]}/{env["GITHUB_REPOSITORY"]}/actions/runs/{env["GITHUB_RUN_ID"]}',
                "bakasu_ref": env.get("BAKASU_REF", ""),
            },
            "packer_original": original,
        }
        blob = json.dumps(patched, indent=2).encode()
        tmp = zpath + ".new"
        with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
            for info, payload in entries:
                if info.filename == target:
                    payload = blob
                zout.writestr(info, payload)
            if target is None:
                zout.writestr("provenance.json", blob)
        os.replace(tmp, zpath)
        with zipfile.ZipFile(zpath) as z:
            got = json.loads(z.read(target or "provenance.json"))
        assert got["source"]["commit"] == env["SUSFS_REF"], "source commit not recorded"
        assert got["build"]["commit"] == env["GITHUB_SHA"], "build commit not recorded"
        assert got["build"]["repository"] == env["GITHUB_REPOSITORY"], "build repo not recorded"
        print(json.dumps(got, indent=2))
        print("rewrote provenance.json inside", zpath)
        PY
    - name: Write a convenience copy beside the zip
      run: |
        set -euo pipefail
        cat > susfs/dist/PROVENANCE.txt <<EOF
        provenance.json INSIDE the zip is authoritative and separates source from build.
        This is a convenience copy for reading without unzipping.

        source repo    : inforcqb/susfs4ksu-lkm
        source commit  : $SUSFS_REF
        build repo     : $GITHUB_REPOSITORY
        build commit   : $GITHUB_SHA
        build ref      : $GITHUB_REF
        build workflow : $GITHUB_WORKFLOW ($GITHUB_WORKFLOW_REF)
        run            : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
        bakasu ref     : $BAKASU_REF
        EOF
        cat susfs/dist/PROVENANCE.txt
    - uses: actions/upload-artifact@v6
      with:
        name: susfs_guard_lkm-module-arm64
        path: |
          susfs/dist/*.zip
          susfs/dist/PROVENANCE.txt
        if-no-files-found: error
