name: SusFS experimental 6.12 build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/susfs-experimental-612.yml'
      - 'tools/instrument-susfs-gate.py'
permissions:
  contents: read
jobs:
  build-612:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828@sha256:fd3ec5cc71d7f2716212e9df8d5674a9afe68fb769282fcac87b83f207f949ee
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/inforcqb/susfs4ksu-lkm.git source
          git -C source checkout --detach 8ab4500ffc3f13ec6ded79d7ab13e2e8147a1879
          test "$(git -C source rev-parse HEAD)" = "8ab4500ffc3f13ec6ded79d7ab13e2e8147a1879"
      - name: Instrument path gate counters
        shell: bash
        run: python3 tools/instrument-susfs-gate.py
      - name: Build GKI Android 16 6.12 kernel module
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test -f "$KDIR/Makefile"
          make -C "$KDIR" M="$PWD/kernel" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules -j"$(nproc)"
          test -s kernel/susfs_guard_lkm.ko
      - name: Audit experimental binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git -C source rev-parse HEAD > audit/source-commit.txt
          sha256sum source/kernel/susfs_guard_lkm.ko > audit/sha256.txt
          file source/kernel/susfs_guard_lkm.ko > audit/file.txt
          (modinfo source/kernel/susfs_guard_lkm.ko || true) > audit/modinfo.txt
          printf '%s\n' 'EXPERIMENTAL GATE-COUNTER INSTRUMENTATION OF PINNED UPSTREAM. NOT VERIFIED ON SAMSUNG. DO NOT FLASH.' > audit/README.txt
          cp source/kernel/susfs_guard_lkm.ko audit/susfs_guard_lkm-android16-6.12-GATE-COUNTERS.ko
      - uses: actions/upload-artifact@v4
        with:
          name: susfs-android16-612-gate-counters-not-flashable
          path: audit/
          if-no-files-found: error
