name: Build BakaSU Diagnostic APK
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/diagnostic-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout BakaSU v4.0.0
        run: git clone --depth 1 --branch v4.0.0 https://github.com/Baka-SU/BakaSU.git upstream
      - name: Apply diagnostic patch
        run: |
          cp scripts/apply-diagnostics.py upstream/apply-diagnostics.py
          cd upstream
          python3 apply-diagnostics.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || exit 1
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug-signed APK
        working-directory: upstream/manager
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BakaSU-4.0.0-Diagnostic-APK
          path: upstream/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
