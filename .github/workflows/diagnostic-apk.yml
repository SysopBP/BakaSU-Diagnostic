name: Build BakaSU v3 Baseline APK
on:
  push:
    paths:
      - '.github/workflows/diagnostic-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout genuine BakaSU v4.2.0-rc3
        run: git clone --depth 1 --branch v4.2.0-rc3 https://github.com/Baka-SU/BakaSU.git upstream
      - name: Verify upstream identity
        run: |
          cd upstream
          echo "Upstream revision: $(git rev-parse HEAD)"
          grep -R -n -m 2 'com.resukisu.resukisu' manager/app/build.gradle* manager/app/src/main/AndroidManifest.xml || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble upstream debug APK without kernel changes
        working-directory: upstream/manager
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BakaSU-v3-rc3-Baseline-Debug-APK
          path: upstream/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
