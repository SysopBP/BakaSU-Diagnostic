# Modified by SysopBP, 2026-10-14: pin workflow dependencies to verified commits.
name: Build BakaSU Diagnostic GPL source bundle
on:
  push:
    paths:
      - '.github/workflows/diagnostic-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repacked:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned BakaSU release
        run: git clone --depth 1 --branch v4.2.0-rc3 https://github.com/Baka-SU/BakaSU.git upstream
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          targets: aarch64-linux-android
          components: rust-src
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build ARM64 ksud from matching upstream source
        working-directory: upstream
        run: |
          set -euo pipefail
          clang --target=aarch64-linux-gnu -c -nostdlib -o userspace/ksud/.lkm_image_bootstrap.o userspace/ksud/src/lkm_image_bootstrap.S
          cd userspace/ksud
          cargo ndk b -P 26 -t aarch64-linux-android -r -Z build-std-features="optimize_for_size" -Z trim-paths
          test -s target/aarch64-linux-android/release/ksud
          file target/aarch64-linux-android/release/ksud
      - name: Add read-only driver compatibility diagnostics
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('manager/app/src/main/java/com/resukisu/resukisu/ui/viewmodel/HomeViewModel.kt')
          s = p.read_text()
          s = s.replace('import androidx.lifecycle.ViewModel', 'import android.util.Log\nimport com.resukisu.resukisu.Natives\nimport androidx.lifecycle.ViewModel', 1)
          anchor = '                    val kernelStatus = runCatching { getKernelStatus() }'
          assert s.count(anchor) == 1, 'Upstream HomeViewModel changed'
          diag = ('                    runCatching {\n'
                  '                        val manager = Natives.isManager\n'
                  '                        val driverVersion = Natives.version\n'
                  '                        val minimum = Natives.MINIMAL_SUPPORTED_KERNEL\n'
                  '                        Log.i("BakaSU-COMPAT", "managerAuthorized=$manager driverVersion=$driverVersion minimumSupported=$minimum driverBelowMinimum=${driverVersion in 0 until minimum}")\n'
                  '                    }.onFailure { Log.e("BakaSU-COMPAT", "Native driver query failed", it) }\n')
          s = s.replace(anchor, diag + anchor, 1)
          p.write_text(s)
          PY
      - name: Build manager APK
        working-directory: upstream/manager
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Repack ARM64 daemon using upstream repacker
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p target/aarch64-linux-android/release
          cp userspace/ksud/target/aarch64-linux-android/release/ksud target/aarch64-linux-android/release/ksud
          keytool -genkeypair -keystore diagnostic.jks -alias diagnostic -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=BakaSU Diagnostic Debug'
          python3 repack_apk_multi.py repack -b debug -t release -a arm64-v8a -K diagnostic.jks -A diagnostic -P android -S android --strip
      - name: Validate repacked APK
        run: |
          set -euo pipefail
          mkdir -p audit
          find upstream/dist -type f -name '*.apk' -print | tee audit/apk-paths.txt
          APK=$(find upstream/dist -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -Z1 "$APK" | tee audit/apk-contents.txt
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libksud.so'
          unzip -p "$APK" lib/arm64-v8a/libksud.so | head -c 4 | od -An -tx1 | tee audit/daemon-header.txt
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK" | tee audit/signature.txt
          sha256sum "$APK" | tee audit/sha256.txt
      - name: Bundle matching modified source and licenses
        run: |
          set -euo pipefail
          mkdir -p distribution
          # git ls-files selects preferred source and excludes generated signing keys.
          (cd upstream && git ls-files -z | tar --null --files-from=- -czf ../distribution/BakaSU-Diagnostic-source.tar.gz)
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("upstream")
          commit = subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
          workspace = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          Path("distribution/SOURCE-PROVENANCE.txt").write_text(
              "Independent BakaSU diagnostic build; not an official release.\n"
              "Upstream: https://github.com/Baka-SU/BakaSU\n"
              "Upstream revision: " + commit + "\nWorkspace revision: " + workspace + "\n"
              "Source archive contains tracked working-tree files including the applied HomeViewModel diagnostics.\n"
              "Reproduce using this workspace's diagnostic-apk.yml at the recorded revision.\n")
          for path in root.glob("LICENSE*"):
              if path.is_file():
                  (Path("distribution") / path.name).write_bytes(path.read_bytes())
          for path in (root / "dist").glob("*.apk"):
              (Path("distribution") / path.name).write_bytes(path.read_bytes())
          PY
          (cd distribution && sha256sum * > SHA256SUMS.txt)
      - name: Remove generated signing material
        if: always()
        run: rm -f upstream/diagnostic.jks

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: BakaSU-v3.3-Build-Audit
          path: audit/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: BakaSU-Diagnostic-ARM64-with-source
          path: distribution/
          if-no-files-found: error
