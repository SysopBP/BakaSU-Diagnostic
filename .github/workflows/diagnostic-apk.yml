name: Build BakaSU Diagnostic v2 APK
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/diagnostic-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout BakaSU v4.0.0
        run: git clone --depth 1 --branch v4.0.0 https://github.com/Baka-SU/BakaSU.git upstream
      - name: Apply diagnostic v2 patch
        run: |
          cp scripts/apply-diagnostics.py upstream/apply-diagnostics.py
          cd upstream
          python3 apply-diagnostics.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || exit 1
      - name: Accept SDK licenses and install NDK 29
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;29.0.13599879'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug-signed APK
        working-directory: upstream/manager
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BakaSU-Diagnostic-v2-APK
          path: upstream/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
